name: Deploy frontend to ankur9301.github.io

# What this does
# --------------
# On every push to main, build the Vite frontend in ./frontend and push the
# contents of dist/ into the separate `ankur9301/ankur9301.github.io` repo's
# main branch. GitHub serves that repo at https://ankur9301.github.io
# automatically (user-page convention).
#
# Why a separate repo:
#   - User pages MUST live at https://<username>.github.io
#   - That URL is served from the repo literally named <username>.github.io
#   - Our source code lives in project_map. So we build here, publish there.
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#   GH_PAGES_TOKEN       Personal Access Token (classic, scope: repo) on the
#                        ankur9301 account. Needs write access to the
#                        ankur9301.github.io repo.
#   VITE_SUPABASE_URL    Public Supabase project URL.
#   VITE_SUPABASE_ANON_KEY  Public anon key (safe in browser, RLS does the work).
#   VITE_API_BASE_URL    Where the FastAPI backend is reachable (e.g. https://api.example.com).
#
# Manual trigger also enabled via workflow_dispatch so you can redeploy without
# pushing a commit.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Cancel an in-flight deploy if a new push lands.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      # The SPA fallback (dist/404.html) is written by vite.config.js, but
      # ensure it exists in case someone disables that plugin.
      - name: Ensure SPA fallback
        run: |
          if [ ! -f frontend/dist/404.html ]; then
            cp frontend/dist/index.html frontend/dist/404.html
          fi
          # CNAME would go here if a custom domain were used later.
          touch frontend/dist/.nojekyll

      - name: Publish to ankur9301.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAGES_TOKEN }}
          external_repository: ankur9301/ankur9301.github.io
          publish_branch: main
          publish_dir: ./frontend/dist
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "deploy: ${{ github.sha }}"
          force_orphan: true   # keep the target repo's history clean
